# ─────────────────────────────────────────────
# application.properties
#
# Configuración principal de Spring Boot.
# Para desarrollo local usa: application-local.properties
# Para producción usa:       application-prod.properties
#
# Propiedades comunes a todos los perfiles:
#   spring.application.name   → nombre de la app
#   server.port               → puerto del servidor (default 8080)
#   spring.datasource.*       → conexión a BD
#   spring.jpa.*              → configuración de Hibernate/JPA
#   spring.security.*         → configuración de seguridad
# ─────────────────────────────────────────────
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
logging.level.org.springframework.boot.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG


spring.application.name=proyecto-fullstack
server.port=8080

#DB
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=cybgor
spring.datasource.password=pass
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


